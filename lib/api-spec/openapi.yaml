openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: diglo-admin
    description: Diglo Ventures quote administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /diglo/admin/login:
    post:
      operationId: digloAdminLogin
      tags: [diglo-admin]
      summary: Sign in to the Diglo quote dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "400":
          description: Invalid request
        "401":
          description: Password was rejected
        "429":
          description: Too many attempts
        "503":
          description: Admin authentication is not configured
  /diglo/admin/logout:
    post:
      operationId: digloAdminLogout
      tags: [diglo-admin]
      summary: End the Diglo admin session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogoutResponse"
  /diglo/admin/quotes:
    get:
      operationId: listDigloQuotes
      tags: [diglo-admin]
      summary: List the newest quotes
      responses:
        "200":
          description: Newest quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DigloQuote"
        "401":
          description: Admin session required
        "503":
          description: Supabase is not configured
  /diglo/admin/quotes/{id}:
    patch:
      operationId: markDigloQuoteDone
      tags: [diglo-admin]
      summary: Mark a quote as done
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigloQuoteStatusUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigloQuote"
        "400":
          description: Invalid request
        "401":
          description: Admin session required
        "404":
          description: Quote not found
        "503":
          description: Supabase is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
    AdminLoginResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
    AdminLogoutResponse:
      type: object
      required: [signedOut]
      properties:
        signedOut:
          type: boolean
    DigloQuote:
      type: object
      required: [id, code, name, phone, product, category, service, quantity, branding_details, delivery_area, message, status, created_at]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        phone:
          type: string
        product:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        service:
          type: ["string", "null"]
        quantity:
          type: integer
          minimum: 1
        branding_details:
          type: ["string", "null"]
        delivery_area:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        status:
          type: string
        created_at:
          type: string
          format: date-time
    DigloQuoteStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Done]

